<!doctype html><meta charset="utf-8"><title>Проверка Aberration v0.2.1</title>
<style>body{font:16px system-ui;background:#121722;color:#edf3fa;padding:24px}canvas{max-width:44vw;width:440px;image-rendering:auto;margin:8px;border:1px solid #555}pre{white-space:pre-wrap}.pass{color:#9edbaf}</style>
<h1>Проверка переноса Aberration</h1><p>Сравнение WebGL с независимым расчётом 64 выборок по формуле Metal. Это не сравнение с запущенной сборкой Movavi.</p>
<pre id="log">Проверка…</pre><div id="pictures"></div>
<script src="movavi-render.js"></script><script>
(async()=>{
 const logs=[]; let failures=0;
 function check(ok,text){logs.push((ok?'PASS':'FAIL')+' '+text);if(!ok)failures++;document.querySelector('#log').textContent=logs.join('\n');}
 function sample(data,w,h,u,v,c){
   const px=u*w-.5,py=v*h-.5,x=Math.floor(px),y=Math.floor(py),fx=px-x,fy=py-y;
   const at=(xx,yy)=>data[(Math.min(h-1,Math.max(0,yy))*w+Math.min(w-1,Math.max(0,xx)))*4+c];
   return (at(x,y)*(1-fx)+at(x+1,y)*fx)*(1-fy)+(at(x,y+1)*(1-fx)+at(x+1,y+1)*fx)*fy;
 }
 function reference(data,w,h,strength,overlap){
   const out=new Uint8ClampedArray(data.length);
   for(let y=0;y<h;y++)for(let x=0;x<w;x++){
     const u=x/w,v=y/h;
     for(let c=0;c<3;c++){
       let sum=0;const offset=(c-1)*(1-overlap);
       for(let j=1;j<=64;j++){
         const k=offset+j/64-.5;
         sum+=sample(data,w,h,u-(u-.5)*strength*k,v-(v-.5)*strength*k,c);
       }
       out[(y*w+x)*4+c]=sum/64;
     }
     out[(y*w+x)*4+3]=sample(data,w,h,u,v,3);
   }
   return out;
 }
 const cfg={strength:{intensityMin:0,intensityMax:.03,hardCoded:false,actualValue:.9},overlap:{intensityMin:0,intensityMax:1,hardCoded:true,actualValue:.85},extra:'keep'};
 const original=JSON.stringify(cfg);
 for(const u of [0,.5,1])check(Math.abs(MovaviRender.resolve(cfg,u).strength.actualValue-.03*u)<1e-10,`Сила ${u*100}% вычисляется из Min/Max`);
 check(MovaviRender.resolve(cfg,.1).overlap.actualValue===.85,'HC=true сохраняет фиксированное значение');
 check(JSON.stringify(cfg)===original,'Расчёт не изменяет production JSON');
 check(Math.abs(MovaviRender.parameter({intensityMin:.1,intensityMax:.09,hardCoded:false,actualValue:99},.5)-.095)<1e-10,'Обратный диапазон не переставляется');
 try {
 for(const [w,h] of [[31,23],[24,32]]){
   const src=document.createElement('canvas');src.width=w;src.height=h;
   const ctx=src.getContext('2d'),im=ctx.createImageData(w,h);
   for(let y=0;y<h;y++)for(let x=0;x<w;x++){
     let i=(y*w+x)*4; im.data[i]=(x*23+y*7)%256;im.data[i+1]=(x*3+y*19)%256;im.data[i+2]=((x^y)*29)%256;im.data[i+3]=255;
   }
   ctx.putImageData(im,0,0);
   for(const [strength,overlap] of [[0,.85],[.03,.85],[.25,0],[.25,1],[1,.5]]){
     const out=document.createElement('canvas');out.width=w;out.height=h;
     MovaviRender.aberration(src,out,{strength:{actualValue:strength},overlap:{actualValue:overlap}});
     const actual=out.getContext('2d').getImageData(0,0,w,h).data,expected=reference(im.data,w,h,strength,overlap);
     let max=0,total=0;for(let i=0;i<actual.length;i++){let d=Math.abs(actual[i]-expected[i]);max=Math.max(max,d);total+=d;}
     check(max<=2,`${w}×${h}, strength=${strength}, overlap=${overlap}: max Δ=${max}/255, mean Δ=${(total/actual.length).toFixed(3)}`);
   }
 }
 const src=document.createElement('canvas');src.width=400;src.height=400;let c=src.getContext('2d');c.fillStyle='#10131a';c.fillRect(0,0,400,400);c.strokeStyle='white';c.lineWidth=3;
 for(let r=20;r<240;r+=20){c.beginPath();c.arc(200,200,r,0,Math.PI*2);c.stroke();}
 c.fillStyle='#ff724a';c.fillRect(55,45,40,90);c.fillStyle='#42c9ff';c.fillRect(300,270,35,90);
 const out=document.createElement('canvas');out.width=400;out.height=400;MovaviRender.aberration(src,out,{strength:{actualValue:.18},overlap:{actualValue:.6}});
 document.querySelector('#pictures').append(src,out);
 }catch(e){check(false,e.stack);}
 check(failures===0,`Итог: ${failures} ошибок`);
 document.title=failures?'FAIL — Aberration':'PASS — Aberration';
})();
</script>
