name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify package
        run: |
          node test-mobile-contract.cjs
          node test-ranges.cjs
          node test-package-import.cjs
          node tests/test-isf-mobile.cjs
          node tests/posterize-time/test-schedule.cjs
          python3 test-launcher.py
      - name: Build ZIP
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, re
          tag = os.environ['RELEASE_TAG']
          if not re.fullmatch(r'v\d+(?:\.\d+){1,2}', tag):
              raise SystemExit('Expected a version tag such as v0.12 or v0.12.1')
          PY
          mkdir -p dist
          git archive --format=zip --prefix="Movavi_Effect_Builder_${RELEASE_TAG}/" --output="dist/Movavi_Effect_Builder_${RELEASE_TAG}.zip" HEAD
          cd dist
          sha256sum *.zip > SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/*.zip dist/SHA256SUMS.txt --clobber
          else
            gh release create "$RELEASE_TAG" dist/*.zip dist/SHA256SUMS.txt --verify-tag --title "Movavi Effect Builder $RELEASE_TAG" --generate-notes
          fi
