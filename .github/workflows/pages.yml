name: Web app
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Stage web assets
        run: python3 tools/build-web.py dist/web
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: dist/web
      - name: Wait for artifact metadata
        uses: actions/github-script@v7
        env:
          PAGES_ARTIFACT: github-pages-${{ github.run_attempt }}
        with:
          script: |
            for (let attempt = 0; attempt < 30; attempt++) {
              const {data} = await github.rest.actions.listWorkflowRunArtifacts({
                ...context.repo, run_id: context.runId, name: process.env.PAGES_ARTIFACT
              });
              if (data.artifacts.filter(a => a.name === process.env.PAGES_ARTIFACT).length === 1) return;
              await new Promise(resolve => setTimeout(resolve, 2000));
            }
            throw new Error('Uploaded Pages artifact metadata is not ready');
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
