<!doctype html><meta charset="utf-8"><title>Проверка Bloom</title><style>body{background:#131925;color:#eee;font:16px system-ui;padding:24px}pre{white-space:pre-wrap}</style><h1>Bloom: формула и границы</h1><p>Проверка локального preview. Вылет Movavi этим тестом не подтверждается.</p><pre id="log">Проверка…</pre><script src="movavi-render.js"></script><script>
(()=>{
let fails=0;const logs=[];function check(ok,t){logs.push((ok?'PASS ':'FAIL ')+t);if(!ok)fails++;document.querySelector('#log').textContent=logs.join('\n');}
const cfg=(t,i,r)=>({threshold:{actualValue:t},intensity:{actualValue:i},radius:{actualValue:r}});
function sample(data,w,h,u,v,c){let xx=u*w-.5,yy=v*h-.5,x=Math.floor(xx),y=Math.floor(yy),fx=xx-x,fy=yy-y;const at=(a,b)=>data[(Math.max(0,Math.min(h-1,b))*w+Math.max(0,Math.min(w-1,a)))*4+c]/255;return (at(x,y)*(1-fx)+at(x+1,y)*fx)*(1-fy)+(at(x,y+1)*(1-fx)+at(x+1,y+1)*fx)*fy;}
function reference(data,w,h,t,intensity,r){const out=new Uint8ClampedArray(data.length);t=Math.fround(t);intensity=Math.fround(intensity);r=Math.trunc(r);for(let y=0;y<h;y++)for(let x=0;x<w;x++)for(let c=0;c<4;c++){
 const u=x/w,v=y/h,color=sample(data,w,h,u,v,c);let blurred=color;
 for(let i=1;i<=6;i++)for(const [a,b] of [[1,1],[-1,1],[1,-1],[-1,-1]])blurred+=sample(data,w,h,u+a*r/w/i,v+b*r/h/i,c);
 blurred/=24;const hi=Math.min(1,Math.max(0,blurred-t))/(1-t);out[(y*w+x)*4+c]=(1-(1-color)*(1-hi*intensity))*255;
}return out;}
try{
for(const [w,h] of [[31,23],[24,32]]){
 const input=document.createElement('canvas');input.width=w;input.height=h;const ctx=input.getContext('2d'),im=ctx.createImageData(w,h);
 for(let y=0;y<h;y++)for(let x=0;x<w;x++){const k=(y*w+x)*4;im.data[k]=(x*23+y*7)%256;im.data[k+1]=(x*3+y*19)%256;im.data[k+2]=((x^y)*29)%256;im.data[k+3]=255;}ctx.putImageData(im,0,0);
 for(const [t,i,r] of [[0,0,0],[0,.8,0],[.3,.8,7],[.3,.8,7.9],[.8,2,75],[.99,1,95],[.9999,10,0],[0,3,4294967295]]){
 const out=document.createElement('canvas');out.width=w;out.height=h;MovaviRender.bloom(input,out,cfg(t,i,r));const actual=out.getContext('2d').getImageData(0,0,w,h).data,expected=reference(im.data,w,h,t,i,r);let max=0,total=0;for(let j=0;j<actual.length;j++){const d=Math.abs(actual[j]-expected[j]);max=Math.max(max,d);total+=d;}check(max<=2,`${w}×${h}, threshold=${t}, intensity=${i}, radius=${r}: max Δ=${max}/255, mean=${(total/actual.length).toFixed(3)}`);
 }
}
for(const [t,i,r,name] of [[1,1,10,'Threshold=1'],[1.01,1,10,'Threshold>1'],[-.01,1,10,'Threshold<0'],[.3,-1,10,'Intensity<0'],[.3,1e39,10,'Intensity переполняет Float32'],[.99999999,1,10,'Округление Threshold до 1'],[.3,1,-1,'Отрицательный Radius (защита редактора)']])check(MovaviRender.bloomDiagnostics(cfg(t,i,r)).errors.length>0,`${name}: обнаружено до запуска шейдера`);
for(const t of [0,.3,.99,.9999,.99999994])check(MovaviRender.bloomDiagnostics(cfg(t,1,75)).errors.length===0,`Threshold ${t}: конечный знаменатель`);
// Analytical extinction check on a uniform 128/255 image: 25 samples divided by 24.
const boundary=128/255*25/24;check(boundary>.5228&&boundary<.5229,`Для ровного серого 128/255 порог исчезновения добавки ≈${boundary.toFixed(6)}; зависит от кадра`);
}catch(e){check(false,e.stack);}
check(fails===0,`Итог: ${fails} ошибок`);document.title=fails?'FAIL — Bloom':'PASS — Bloom';
})();
</script>
