<!doctype html><meta charset="utf-8"><title>Bloom Rework — сравнение</title><style>body{background:#11131a;color:white;font:16px system-ui;margin:24px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}canvas{width:100%;background:#000}pre{white-space:pre-wrap;color:#b9dccc}h2{font-size:18px}</style><h1>Bloom Movavi / Bloom Rework</h1><p>Синтетический тест: яркие контуры и цветные источники света. Одинаковые Threshold 0.3, Intensity 1.2, Radius 90.</p><div class="grid"><div><h2>Исходник</h2><canvas id="source" width="640" height="360"></canvas></div><div><h2>Bloom Movavi</h2><canvas id="old" width="640" height="360"></canvas></div><div><h2>Bloom Rework</h2><canvas id="new" width="640" height="360"></canvas></div></div><pre id="results">Проверка…</pre><script src="movavi-render.js"></script><script src="bloom-rework.js"></script><script>
const src=document.querySelector('#source'),old=document.querySelector('#old'),out=document.querySelector('#new'),ctx=src.getContext('2d');
ctx.fillStyle='#090b14';ctx.fillRect(0,0,640,360);ctx.fillStyle='#f5f8ff';ctx.font='bold 60px system-ui';ctx.fillText('GLOW',36,100);ctx.strokeStyle='#d9f6ff';ctx.lineWidth=3;ctx.strokeRect(38,158,125,130);ctx.fillStyle='#ff782c';ctx.beginPath();ctx.arc(332,224,20,0,Math.PI*2);ctx.fill();ctx.fillStyle='#40cfff';ctx.fillRect(500,150,7,160);
const config={threshold:{actualValue:.3},intensity:{actualValue:1.2},radius:{actualValue:90}},options={knee:.5,scatter:.65,opacity:1};
const logs=[],say=(ok,s)=>logs.push((ok?'PASS ':'FAIL ')+s),pixels=c=>c.getContext('2d').getImageData(0,0,c.width,c.height).data;
try{
MovaviRender.bloom(src,old,config);BloomRework.render(src,out,config,options);const base=pixels(src),rework=pixels(out),native=pixels(old);
say(rework.some((v,i)=>v!==base[i]),'Rework создаёт свечение');say(rework.some((v,i)=>v!==native[i]),'Результат отличается от старого алгоритма');say(rework.every((v,i)=>i%4!==3 || v===base[i]),'Альфа исходника сохранена');
BloomRework.render(src,out,config,{...options,opacity:0});say(pixels(out).every((v,i)=>v===base[i]),'Непрозрачность 0 возвращает исходник точно');
BloomRework.render(src,out,{...config,intensity:{actualValue:0}},options);say(pixels(out).every((v,i)=>v===base[i]),'Сила 0 возвращает исходник точно');
BloomRework.render(src,out,{...config,threshold:{actualValue:1}},options);say(!pixels(out).every((v,i)=>i%4===3||v===255),'Threshold 1 не вызывает белого кадра/деления на ноль');
const small=document.createElement('canvas'),dest=document.createElement('canvas');small.width=dest.width=37;small.height=dest.height=19;small.getContext('2d').fillStyle='red';small.getContext('2d').fillRect(0,0,37,19);BloomRework.render(small,dest,config,options);BloomRework.render(src,out,config,options);say(pixels(out).every((v,i)=>v===rework[i]),'Смена разрешения и повторный кадр стабильны');
// Uniform image reference: blur preserves constants; independent scalar pipeline.
const u=document.createElement('canvas'),v=document.createElement('canvas');u.width=v.width=64;u.height=v.height=64;u.getContext('2d').fillStyle='rgb(160,160,160)';u.getContext('2d').fillRect(0,0,64,64);BloomRework.render(u,v,config,options);
const lin=x=>x<=.04045?x/12.92:((x+.055)/1.055)**2.4,enc=x=>x<=.0031308?x*12.92:1.055*x**(1/2.4)-.055;
const b=lin(160/255),t=lin(.3),k=t*.5,s=Math.max(0,Math.min(2*k,b-t+k)),g=Math.max(b-t,s*s/(4*k));const expected=Math.round(255*enc(b+(1-b)*(1-Math.exp(-g*1.2*3))));say(Math.abs(pixels(v)[0]-expected)<=2,'Равномерный кадр совпадает с независимым расчётом (±2/255)');
u.getContext('2d').fillStyle='#090b14';u.getContext('2d').fillRect(0,0,64,64);BloomRework.render(u,v,config,options);say(pixels(v).every((n,i)=>Math.abs(n-pixels(u)[i])<=1),'Тёмный кадр без бликов не покрывается дымкой');
BloomRework.render(src,out,config,options);let times=[];for(let i=0;i<30;i++){const start=performance.now();BloomRework.render(src,out,config,options);pixels(out);times.push(performance.now()-start);}times.sort((a,b)=>a-b);logs.push('640×360, 30 кадров с чтением результата: медиана '+times[15].toFixed(1)+' мс; p95 '+times[28].toFixed(1)+' мс. Это браузерный тест, не замер на iPhone.');logs.push(JSON.stringify(BloomRework.info()));
}catch(e){say(false,e.stack)}document.querySelector('#results').textContent=logs.join('\n');document.title=logs.some(x=>x.startsWith('FAIL'))?'FAIL Rework':'PASS Rework';
</script>
